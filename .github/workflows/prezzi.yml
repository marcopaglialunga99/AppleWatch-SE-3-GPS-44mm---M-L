name: Controllo prezzi

on:
  schedule:
    - cron: "15,45 * * * *"
      timezone: "Europe/Rome"
    - cron: "0 7 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRICE_TRACKER_ONCE: "true"
      TZ: "Europe/Rome"

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa i pacchetti
        run: python -m pip install -r requirements.txt

      - name: Installa Chromium
        run: python -m playwright install --with-deps chromium

      - name: Controlla i prezzi
        run: python -u price_tracker.py
        
      - name: Salva lo storico dei prezzi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prezzi.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna storico prezzi"
            git push
          fi
